<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SafetyON™ All-in-One Electronic Digital Rearview Mirror Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { 
    background: #050811; 
    color: #f8fafc; 
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Pretendard', sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    overflow-x: hidden; 
    padding: 4px; 
  }
  
  #canvas-container { 
    position: relative; 
    width: 100%; 
    max-width: 1360px; 
    aspect-ratio: 1360 / 680; 
    background: #0a0e18; 
    border: 3px solid #334155; 
    border-radius: 8px; 
    box-shadow: 0 12px 40px rgba(0,0,0,0.9); 
  }
  canvas { 
    width: 100%; 
    height: 100%; 
    display: block; 
    border-radius: 5px; 
    cursor: pointer; 
  }
  
  /* 비디오 엘리먼트: 뷰포트 내 1x1 투명 배치 (크롬/사파리 백그라운드 스로틀링 방지) */
  #video-element { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 1px; 
    height: 1px; 
    opacity: 0.01; 
    pointer-events: none; 
    z-index: -1; 
  }
  
  /* 상단 모바일/웹캠 시작 배너 */
  #cam-banner { 
    position: absolute; 
    top: 12px; 
    left: 50%; 
    transform: translateX(-50%); 
    background: linear-gradient(135deg, #0284c7, #0369a1); 
    color: #fff; 
    padding: 8px 24px; 
    border-radius: 24px; 
    font-size: 13px; 
    font-weight: bold; 
    border: 2px solid #38bdf8; 
    z-index: 50; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.7); 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 15px rgba(56,189,248,0.5); }
    50% { transform: translateX(-50%) scale(1.03); box-shadow: 0 0 25px rgba(56,189,248,0.9); }
  }
  
  #dock { 
    width: 100%; 
    max-width: 1360px; 
    display: grid; 
    grid-template-columns: repeat(11, 1fr); 
    gap: 4px; 
    margin-top: 6px; 
  }
  .btn { 
    padding: 10px 2px; 
    font-size: 11px; 
    font-weight: bold; 
    color: white; 
    border: none; 
    border-radius: 6px; 
    cursor: pointer; 
    text-align: center; 
    transition: all 0.12s; 
    white-space: nowrap; 
  }
  .btn:active { transform: scale(0.94); opacity: 0.9; }
  .btn-space { background: #dc2626; }
  .btn-eye { background: #ea580c; border: 2px solid #fef08a; } /* 눈감기/기절 토글 */
  .btn-a { background: #d97706; }
  .btn-f { background: #0284c7; }
  .btn-b { background: #7c3aed; }
  .btn-l { background: #16a34a; }
  .btn-tab { background: #0891b2; }
  .btn-t { background: #059669; }
  .btn-s { background: #475569; }
  .btn-r { background: #2563eb; }
  .btn-qr { background: #0d9488; }
  
  /* 모바일 QR 모달 */
  #qr-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  #qr-card {
    background: #0f172a;
    border: 2px solid #38bdf8;
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  #qr-card img { width: 220px; height: 220px; border-radius: 8px; margin: 16px 0; background: white; padding: 8px; }
  #qr-card button {
    background: #2563eb; color: white; border: none; padding: 8px 24px; border-radius: 6px; font-weight: bold; cursor: pointer;
  }

  @media (max-width: 768px) {
    #dock { grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .btn { padding: 8px 2px; font-size: 10px; }
    #cam-banner { font-size: 11px; padding: 6px 14px; width: 92%; text-align: center; justify-content: center; }
  }
</style>
</head>
<body>

<video id="video-element" autoplay playsinline webkit-playsinline muted></video>

<div id="canvas-container">
  <div id="cam-banner" onclick="startCameraAndAudio()">📷 [터치하여 카메라 켜기] 실시간 눈동자 DSM & 음성 시작</div>
  <canvas id="mirror" width="1360" height="680" onclick="handleCanvasClick(event)"></canvas>
</div>

<div id="dock">
  <button class="btn btn-space" onclick="triggerSPACE()">SPACE: 기절/갓길</button>
  <button class="btn btn-eye" onclick="toggleEyes()">👁️ E: 기절/눈감기</button>
  <button class="btn btn-a" onclick="triggerSUA()">A: 급발진 150kgf</button>
  <button class="btn btn-f" onclick="triggerFlood()">F: 침수 도어파쇄</button>
  <button class="btn btn-b" onclick="triggerBattery()">B: EV배터리 방호</button>
  <button class="btn btn-l" onclick="triggerLeftLane()">L: 좌측회피</button>
  <button class="btn btn-tab" onclick="toggleFullScreen()">TAB: 전체화면</button>
  <button class="btn btn-t" onclick="toggleTimer()">T: 발표타이머</button>
  <button class="btn btn-s" onclick="toggleMute()">S: 음소거</button>
  <button class="btn btn-r" onclick="resetSim()">R: 리셋</button>
  <button class="btn btn-qr" onclick="toggleQRModal()">QR: 모바일체험</button>
</div>

<!-- 심사위원용 모바일 QR 팝업 -->
<div id="qr-modal" onclick="toggleQRModal()">
  <div id="qr-card" onclick="event.stopPropagation()">
    <h3 style="color:#38bdf8; font-size:16px;">📱 심사위원 스마트폰 개별 체험용 QR</h3>
    <p style="color:#94a3b8; font-size:12px; margin-top:6px;">심사위원 여러 명이 동시에 스캔하셔도<br>각자의 폰에서 독립적으로 전면 카메라 DSM이 작동합니다.</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://turtle-scanner.github.io/SafetyOn-Digital-Mirror/" alt="QR Code">
    <button onclick="toggleQRModal()">닫기</button>
  </div>
</div>

<script>
const canvas = document.getElementById('mirror');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video-element');
const camBanner = document.getElementById('cam-banner');
const qrModal = document.getElementById('qr-modal');

// 오프스크린 캔버스 (실시간 눈동자/동공 컴퓨터 비전 분석용)
const offCanvas = document.createElement('canvas');
offCanvas.width = 160;
offCanvas.height = 120;
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

let hasWebcam = false;
let simTime = 0;
let lastTime = performance.now();

// 차량 및 시뮬레이션 상태
let speed = 82.0;
let currentLaneF = 3.0; // 3.0 = 3차선, 5.8 = 5차선 최우측 갓길 정차
let state = "NORMAL";   // NORMAL, COUNTDOWN_5SEC, EVADE_STAGE1, EVADE_STAGE2, EVADE_STAGE3, EVADE_BRAKING, STOPPED, SUA, BATTERY, FLOOD
let gForce = 0.0;
let steerAngle = 0.0;
let countdown = 10.0;
let countdownReason = "두 눈 감김(졸음운전)";

// 🌟 심박수 (대표님 요청: 기절 시 40bpm으로 급감!)
let heartRate = 74;     // 정상 74bpm -> 기절/자리비움 시 40bpm

// 🌟 [핵심] 실시간 동공 추적 좌표 및 개도율 엔진
let eyeOpenRatio = 95;      // 0 ~ 100%
let leftOpen = true;
let rightOpen = true;
let isFaceDetected = true;  // 자리비움 감지
let userClosedEyesManually = false;
let eyesClosedDuration = 0.0;
let missingDriverDuration = 0.0;
let evadeStartTime = 0;
let rightMergeStatus = "";

// 실시간 눈동자 십자선 좌표 (카메라 비디오 상 오프셋)
let leftPupilX = 300;
let leftPupilY = 310;
let rightPupilX = 450;
let rightPupilY = 310;
let pupilLocked = false;

// 깜빡이 및 비상등 상태
let turnSignalRight = false;
let hazardLights = false;
let blinkPhase = false;
let lastBlinkTime = 0;
let blinkerTick = false;

// 주변 차량 물리
let rearLeadDist = 22.0;
let rearLeadOffsetX = 0.0;
let frontLeadDist = 32.0;

// 시스템 상태
let isMuted = false;
let timerRunning = false;
let timerSec = 0;
let roadOffset = 0;

// 트래픽
let leftTraffic = [
  { y: 180, speed: 95, type: 'BUS', col: '#b91c1c', w: 38, h: 80, lane: 0 },
  { y: 460, speed: 105, type: 'SEDAN', col: '#1e3a8a', w: 28, h: 50, lane: 1 }
];
let rightTraffic = [
  { y: 120, speed: 70, type: 'TRUCK', col: '#475569', w: 36, h: 75, lane: 0 },
  { y: 390, speed: 65, type: 'SUV', col: '#334155', w: 30, h: 55, lane: 1 }
];

// -------------------------------------------------------------
// 🔊 리얼 사운드 & 음성 안내 TTS 엔진
// -------------------------------------------------------------
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContextClass();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function speakVoice(text, audioPath) {
  if (isMuted) return;
  initAudio();
  if (audioPath) {
    try {
      const audio = new Audio(audioPath);
      audio.volume = 1.0;
      audio.play().catch(() => playTTS(text));
    } catch(e) {
      playTTS(text);
    }
  } else {
    playTTS(text);
  }
}

function playTTS(text) {
  if (isMuted || !window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 1.05;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
  } catch(e){}
}

function playBlinkerRelay(isTick) {
  if (isMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(isTick ? 1250 : 780, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.038);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.04);
  } catch(e){}
}

function playBeep(freq=950, dur=0.12, vol=0.18) {
  if (isMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  } catch(e){}
}

function playSiren() {
  if (isMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.linearRampToValueAtTime(950, now + 0.5);
    osc.frequency.linearRampToValueAtTime(600, now + 1.0);
    osc.frequency.linearRampToValueAtTime(950, now + 1.5);
    osc.frequency.linearRampToValueAtTime(600, now + 2.0);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 1.8);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.1);
  } catch(e){}
}

function playBrakeSound() {
  if (isMuted || !audioCtx) return;
  try {
    playBeep(450, 0.4, 0.3);
    setTimeout(() => playBeep(350, 0.5, 0.25), 150);
  } catch(e){}
}

function playGlassShatter() {
  if (isMuted || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, now);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch(e){}
}

// -------------------------------------------------------------
// 📷 카메라 및 오디오 동시 활성화
// -------------------------------------------------------------
function startCameraAndAudio() {
  initAudio();
  playBeep(880, 0.08, 0.1);

  if (hasWebcam && video.readyState >= 2) {
    camBanner.style.display = 'none';
    return;
  }

  camBanner.innerText = "⏳ 카메라 권한 요청 중... [허용]을 눌러주세요";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camBanner.innerText = "⚠️ 카메라 미지원 (가상 DSM 시뮬레이션으로 작동)";
    setTimeout(() => { camBanner.style.display = 'none'; }, 2000);
    return;
  }

  const tryUserMedia = (constraints) => {
    return navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        video.srcObject = stream;
        video.setAttribute("playsinline", "true");
        video.setAttribute("webkit-playsinline", "true");
        return video.play().then(() => {
          hasWebcam = true;
          camBanner.style.display = 'none';
        });
      });
  };

  tryUserMedia({ video: { facingMode: "user" }, audio: false })
    .catch(() => tryUserMedia({ video: true, audio: false }))
    .catch(err => {
      console.warn("카메라 권한 차단 또는 미연결:", err);
      camBanner.innerText = "ℹ️ 가상 DSM 시뮬레이션 모드 (화면 터치 시 눈감기/기절 토글)";
      camBanner.style.background = "#334155";
      setTimeout(() => { camBanner.style.display = 'none'; }, 2500);
    });
}

window.addEventListener('load', () => setTimeout(startCameraAndAudio, 500));
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

// -------------------------------------------------------------
// 👁️ [실제 컴퓨터 비전] 실시간 눈동자(동공) 인식 및 기절/자리비움 알고리즘
// -------------------------------------------------------------
let lastAnalysisTime = 0;

function analyzeCameraFeed(now) {
  if (!hasWebcam || video.readyState < 2 || video.videoWidth === 0) return;
  if (now - lastAnalysisTime < 100) return; // 초당 10회 정밀 동공 분석
  lastAnalysisTime = now;

  try {
    offCtx.drawImage(video, 0, 0, 160, 120);
    const frameData = offCtx.getImageData(0, 0, 160, 120).data;

    // 1. 얼굴 피부색 검출 (자리비움 판단)
    let skinPixels = 0;
    let totalSamples = 0;
    
    // 중앙 안면 ROI (X: 35~125, Y: 20~100)
    for (let y = 20; y < 100; y += 2) {
      for (let x = 35; x < 125; x += 2) {
        let idx = (y * 160 + x) * 4;
        let r = frameData[idx];
        let g = frameData[idx + 1];
        let b = frameData[idx + 2];
        totalSamples++;
        if (r > 60 && g > 40 && b > 20 && (r - g > 12) && (r - b > 12)) {
          skinPixels++;
        }
      }
    }

    let skinRatio = skinPixels / totalSamples;
    isFaceDetected = (skinRatio >= 0.08);

    // 2. 실시간 동공(Pupil) 중심점 탐색 (좌안: X 45~75, Y 35~60 / 우안: X 85~115, Y 35~60)
    if (isFaceDetected && !userClosedEyesManually) {
      let minLumL = 255, bestLx = 60, bestLy = 48;
      let minLumR = 255, bestRx = 100, bestRy = 48;
      let darkCountL = 0, darkCountR = 0;

      // 좌안 영역 스캔
      for (let y = 35; y < 60; y++) {
        for (let x = 45; x < 75; x++) {
          let idx = (y * 160 + x) * 4;
          let lum = frameData[idx] * 0.299 + frameData[idx + 1] * 0.587 + frameData[idx + 2] * 0.114;
          if (lum < minLumL) {
            minLumL = lum;
            bestLx = x;
            bestLy = y;
          }
          if (lum < 65) darkCountL++;
        }
      }

      // 우안 영역 스캔
      for (let y = 35; y < 60; y++) {
        for (let x = 85; x < 115; x++) {
          let idx = (y * 160 + x) * 4;
          let lum = frameData[idx] * 0.299 + frameData[idx + 1] * 0.587 + frameData[idx + 2] * 0.114;
          if (lum < minLumR) {
            minLumR = lum;
            bestRx = x;
            bestRy = y;
          }
          if (lum < 65) darkCountR++;
        }
      }

      // 캔버스 좌표계로 스케일 변환 (160x120 -> 730x260)
      // 비디오가 가로 반전되어 렌더링되므로 X축 좌표 매핑
      leftPupilX = (1.0 - (bestRx / 160)) * 730;
      leftPupilY = (bestRy / 120) * 260;
      rightPupilX = (1.0 - (bestLx / 160)) * 730;
      rightPupilY = (bestLy / 120) * 260;

      // 동공 개폐 판정 (눈 감으면 어두운 동공 픽셀이 소멸)
      let avgDark = (darkCountL + darkCountR) / 2;
      if (avgDark < 6) {
        // 눈 감김 감지! (기절)
        eyeOpenRatio = 0;
        leftOpen = false;
        rightOpen = false;
        pupilLocked = false;
      } else {
        // 눈 뜸! (동공 락온)
        eyeOpenRatio = 95;
        leftOpen = true;
        rightOpen = true;
        pupilLocked = true;
      }
    }
  } catch(e) {}
}

// -------------------------------------------------------------
// 👁️ 눈감기/기절/자리비움 수동 및 터치 토글
// -------------------------------------------------------------
function toggleEyes() {
  initAudio();
  userClosedEyesManually = !userClosedEyesManually;
  
  if (userClosedEyesManually) {
    eyeOpenRatio = 0;
    leftOpen = false;
    rightOpen = false;
    pupilLocked = false;
    playBeep(920, 0.25, 0.25);
  } else {
    eyeOpenRatio = 95;
    leftOpen = true;
    rightOpen = true;
    isFaceDetected = true;
    pupilLocked = true;
    playBeep(650, 0.15, 0.15);
    speakVoice("운전자 의식 정상 복귀. 안전 주행을 유지합니다.");
  }
}

function handleCanvasClick(e) {
  initAudio();
  if (!hasWebcam) startCameraAndAudio();

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clickX = (e.clientX - rect.left) * scaleX;
  const clickY = (e.clientY - rect.top) * scaleY;

  // CH-1 운전자 박스 내부 클릭 시 기절/눈감기 토글
  if (clickX >= 315 && clickX <= 1045 && clickY >= 215 && clickY <= 475) {
    toggleEyes();
  }
}

function triggerSPACE() {
  initAudio();
  if (state === "NORMAL") {
    userClosedEyesManually = true;
    eyeOpenRatio = 0;
    leftOpen = false;
    rightOpen = false;
    pupilLocked = false;
    playBeep(920, 0.25, 0.25);
  } else if (state.startsWith("COUNTDOWN")) {
    state = "EVADE_STAGE1";
    evadeStartTime = performance.now() / 1000;
    turnSignalRight = true;
    hazardLights = true;
    playBeep(1100, 0.2, 0.3);
    speakVoice("비상 감속을 시작합니다. 우측 갓길로 안전하게 정차합니다.", "safetyon_sounds/announce_stop.wav");
  }
}

function triggerSUA() {
  initAudio();
  state = "SUA";
  hazardLights = true;
  turnSignalRight = false;
  heartRate = 40;
  playBrakeSound();
  speakVoice("비상 제동 작동. 150킬로그램포스 전자식 비상 감속을 체결합니다.", "safetyon_sounds/voice_sua.wav");
}

function triggerFlood() {
  initAudio();
  state = "FLOOD";
  hazardLights = true;
  playGlassShatter();
  speakVoice("차량 침수 감지. 비상 탈출을 위한 도어 유리 파쇄 핀을 작동합니다.", "safetyon_sounds/voice_flood.wav");
}

function triggerBattery() {
  initAudio();
  state = "BATTERY";
  hazardLights = true;
  playBeep(700, 0.35, 0.25);
  speakVoice("배터리 이상 온도 감지. 열폭주 방호 시스템을 가동합니다.", "safetyon_sounds/voice_battery.wav");
}

function triggerLeftLane() {
  initAudio();
  currentLaneF = 2.0;
  steerAngle = -4.5;
  turnSignalRight = false;
  hazardLights = false;
  playBlinkerRelay(true);
  speakVoice("좌측 추월 회피 기동을 실시합니다.");
  setTimeout(() => {
    currentLaneF = 3.0;
    steerAngle = 0.0;
  }, 2500);
}

function toggleTimer() { initAudio(); timerRunning = !timerRunning; }
function toggleMute() { isMuted = !isMuted; }
function toggleFullScreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else if (document.exitFullscreen) document.exitFullscreen();
}
function toggleQRModal() {
  qrModal.style.display = (qrModal.style.display === 'flex') ? 'none' : 'flex';
}

function resetSim() {
  initAudio();
  state = "NORMAL";
  speed = 82.0;
  currentLaneF = 3.0;
  gForce = 0.0;
  steerAngle = 0.0;
  countdown = 10.0;
  eyeOpenRatio = 95;
  leftOpen = true;
  rightOpen = true;
  isFaceDetected = true;
  userClosedEyesManually = false;
  eyesClosedDuration = 0.0;
  missingDriverDuration = 0.0;
  heartRate = 74;
  rearLeadDist = 22.0;
  rearLeadOffsetX = 0.0;
  hazardLights = false;
  turnSignalRight = false;
  sirenTriggered = false;
  playBeep(650, 0.15, 0.15);
  speakVoice("시뮬레이션이 초기화되었습니다. 정상 주행을 시작합니다.");
}

setInterval(() => { if (timerRunning) timerSec++; }, 1000);

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); triggerSPACE(); }
  else if (e.key === 'e' || e.key === 'E') toggleEyes();
  else if (e.key === 'a' || e.key === 'A') triggerSUA();
  else if (e.key === 'f' || e.key === 'F') triggerFlood();
  else if (e.key === 'b' || e.key === 'B') triggerBattery();
  else if (e.key === 'l' || e.key === 'L') triggerLeftLane();
  else if (e.key === 't' || e.key === 'T') toggleTimer();
  else if (e.key === 's' || e.key === 'S') toggleMute();
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 'Tab') { e.preventDefault(); toggleFullScreen(); }
});

// -------------------------------------------------------------
// 메인 애니메이션 & 다단 비상 정차 물리 루프 (60 FPS)
// -------------------------------------------------------------
let sirenTriggered = false;
let announced5sec = false;
let announcedStop = false;

function loop(now) {
  const dt = Math.min(0.06, (now - lastTime) / 1000);
  lastTime = now;
  simTime += dt;
  const nowSec = now / 1000;

  roadOffset = (roadOffset - speed * dt * 7.5) % 80;
  if (roadOffset > 0) roadOffset -= 80;

  // 1. 실시간 웹캠 프레임 안면 & 눈동자(동공) 컴퓨터 비전 분석
  analyzeCameraFeed(now);

  // 2. 깜빡이 / 비상등 점멸 (0.44초 간격)
  if (now - lastBlinkTime > 440) {
    lastBlinkTime = now;
    blinkPhase = !blinkPhase;

    if (hazardLights || turnSignalRight) {
      blinkerTick = !blinkerTick;
      playBlinkerRelay(blinkerTick);
    }
  }

  // -------------------------------------------------------------
  // 🌟 3. 실제 기절/자리비움 감지 및 다단 비상정차 상태머신
  // -------------------------------------------------------------
  const isAbnormal = (eyeOpenRatio === 0) || (!isFaceDetected) || userClosedEyesManually;

  if (isAbnormal) {
    if (!isFaceDetected) {
      missingDriverDuration += dt;
      countdownReason = "운전자 자리비움(이탈)";
    } else {
      eyesClosedDuration += dt;
      countdownReason = "두 눈 감김(졸음/기절)";
    }

    const abnormalDur = Math.max(eyesClosedDuration, missingDriverDuration);

    // 🌟 [대표님 요청] 심박수 40bpm으로 급감 (기절 시 서맥)
    heartRate = Math.max(40, Math.round(74 - abnormalDur * 4.5));

    // 0s ~ 5s: 주의 단계 (간헐적 삐-삐- 경고음)
    if (abnormalDur >= 1.5 && state === "NORMAL") {
      if (Math.floor(simTime * 2) % 2 === 0 && blinkPhase) {
        playBeep(920, 0.08, 0.15);
      }
    }

    // 5.0초 도달 시: "5초 후 비상정차를 시도합니다" 한국어 음성 출력!
    if (abnormalDur >= 5.0 && state === "NORMAL") {
      state = "COUNTDOWN_5SEC";
      hazardLights = true;
      if (!announced5sec) {
        announced5sec = true;
        speakVoice("5초 후 비상정차를 시도합니다.", "safetyon_sounds/announce_5sec.mp3");
      }
    }

    if (state === "COUNTDOWN_5SEC") {
      countdown = Math.max(0.0, 10.0 - abnormalDur);
      if (Math.floor(simTime * 2.5) % 2 === 0 && blinkPhase) {
        playBeep(950, 0.09, 0.2);
      }

      // 10.0초 도달 시: 갓길 자율 다단 회피 감속 발동!
      if (abnormalDur >= 10.0) {
        state = "EVADE_STAGE1";
        evadeStartTime = nowSec;
        turnSignalRight = true;
        hazardLights = true;
        if (!announcedStop) {
          announcedStop = true;
          speakVoice("비상 감속을 시작합니다. 우측 갓길로 안전하게 정차합니다.", "safetyon_sounds/announce_stop.wav");
        }
      }
    }

  } else {
    // 눈을 뜨거나 얼굴이 복귀하면 타이머 리셋 및 정상 주행 복귀!
    eyesClosedDuration = 0.0;
    missingDriverDuration = 0.0;
    heartRate = Math.min(74, Math.round(heartRate + dt * 15.0));

    if (state === "COUNTDOWN_5SEC") {
      state = "NORMAL";
      hazardLights = false;
      turnSignalRight = false;
      announced5sec = false;
      announcedStop = false;
      countdown = 10.0;
    }
  }

  // -------------------------------------------------------------
  // 🌟 다단 자율 회피 제동 (S-Curve 카운터스티어 & 갓길 1.2m 안착)
  // -------------------------------------------------------------
  if (state.startsWith("EVADE")) {
    const elapsed = nowSec - evadeStartTime;
    hazardLights = true;

    if (elapsed < 1.8) {
      // 1단계: 안전 차간거리 확인 및 82 -> 75km/h 부드러운 감속 준비
      state = "EVADE_STAGE1";
      speed = Math.max(75.0, 82.0 - elapsed * 3.8);
      steerAngle = 0.0;
      currentLaneF = 3.0;
      gForce = -0.06;
      turnSignalRight = true;
      rightMergeStatus = "[우측 감시] 인접 차로(SUV, 오토바이) 안전거리 45m 확인 중...";
    } else if (elapsed < 4.4) {
      // 2단계: 4차선으로 부드러운 S자 진입 (조향각 9.2° 회전 보정)
      state = "EVADE_STAGE2";
      let p2 = (elapsed - 1.8) / 2.6;
      let s2 = 0.5 - 0.5 * Math.cos(Math.PI * p2);
      currentLaneF = 3.0 + s2 * 1.2;
      steerAngle = 9.2 * Math.sin(Math.PI * p2 * 2.0);
      speed = Math.max(66.0, 75.0 - p2 * 9.0);
      gForce = -0.10;
      turnSignalRight = true;
      rightMergeStatus = `[차선 변경 1단계] 4차로 안전 진입 중 (조향각 ${steerAngle.toFixed(1)}° 자율 보정)`;
    } else if (elapsed < 7.2) {
      // 3단계: 5차선 최우측 갓길 1.2m 밀착 및 수평 정렬
      state = "EVADE_STAGE3";
      let p3 = (elapsed - 4.4) / 2.8;
      let s3 = 0.5 - 0.5 * Math.cos(Math.PI * p3);
      currentLaneF = 4.2 + s3 * 1.6;
      steerAngle = 5.8 * Math.sin(Math.PI * p3 * 2.0);
      speed = Math.max(55.0, 66.0 - p3 * 11.0);
      gForce = -0.14;
      turnSignalRight = true;
      rightMergeStatus = `[갓길 안착 2단계] 가드레일 밀착 및 핸들 0° 복귀`;
    } else {
      // 4단계: 갓길 안착 완료 후 0.25G 본격 감속 브레이킹 -> 완전 정차!
      state = "EVADE_BRAKING";
      currentLaneF = 5.8;
      steerAngle = 0.0;
      gForce = -0.25;
      turnSignalRight = false;
      speed = Math.max(0.0, speed - dt * 26.0);
      rightMergeStatus = "[갓길 안착 완료] 0.25G 안전 다단 감속 브레이킹";

      if (speed <= 0.0) {
        state = "STOPPED";
        speed = 0.0;
        gForce = 0.0;
        steerAngle = 0.0;
        rightMergeStatus = "[최우측 갓길 정차 완료] 3자 동시 e-Call 연결 가동";

        if (!sirenTriggered) {
          sirenTriggered = true;
          playSiren();
          speakVoice("최우측 갓길 안전 정차 완료. 119 소방청 긴급 구난 및 3자 동시 e-Call을 연결합니다.", "safetyon_sounds/voice_safe_stop.wav");
        }
      }
    }

    rearLeadOffsetX = Math.min(140, rearLeadOffsetX + dt * 48.0);
    rearLeadDist = Math.min(55, rearLeadDist + dt * 9.0);

  } else if (state === "SUA") {
    speed = Math.max(0.0, speed - dt * 38.0);
    gForce = -0.38;
    hazardLights = true;
    rearLeadOffsetX = 0.0;
    if (speed <= 0.0) rearLeadDist = Math.max(8.5, rearLeadDist - dt * 14);
    else rearLeadDist = Math.max(12.0, rearLeadDist - dt * 8);
  } else if (state === "BATTERY") {
    speed = Math.max(0.0, speed - dt * 18.0);
    gForce = -0.20;
    hazardLights = true;
    if (speed <= 0.0) rearLeadDist = Math.max(8.5, rearLeadDist - dt * 12);
  } else if (state === "NORMAL") {
    sirenTriggered = false;
    hazardLights = false;
    turnSignalRight = false;
    announced5sec = false;
    announcedStop = false;
    rearLeadDist = 22.0 + Math.sin(simTime * 1.5) * 4.5;
    rearLeadOffsetX = 0.0;
  }

  // 🌟 사이드 트래픽 이동 (대표님 요청: 모든 통행 차량이 같은 방향 [아래에서 위로] 전진 주행!)
  for (let v of leftTraffic) {
    let relSpeed = v.speed - speed;
    let vy;
    if (speed <= 5.0) {
      vy = -v.speed * 6.8; // 우리 차가 정차하면 통행 차량들이 아래에서 위로 쌩쌩 전진 통과!
    } else {
      vy = -relSpeed * 6.8; // 우리보다 빠른 차는 아래에서 위로(정방향) 추월!
    }
    v.y += vy * dt;
    if (v.y < -120) v.y = 640;
    if (v.y > 680) v.y = -80;
  }
  for (let v of rightTraffic) {
    let relSpeed = v.speed - speed;
    let vy;
    if (speed <= 5.0) {
      vy = -v.speed * 6.8;
    } else {
      vy = -relSpeed * 6.8;
    }
    v.y += vy * dt;
    if (v.y < -120) v.y = 640;
    if (v.y > 680) v.y = -80;
  }

  // -------------------------------------------------------------
  // 4. 캔버스 렌더링
  // -------------------------------------------------------------
  ctx.fillStyle = "#0c101c";
  ctx.fillRect(0, 0, 1360, 680);

  // 미러 테두리 (비상 시 테두리 점멸)
  let borderAlert = (hazardLights && blinkPhase);
  ctx.strokeStyle = borderAlert ? "#ef4444" : "#38bdf8";
  ctx.lineWidth = borderAlert ? 5 : 3;
  ctx.strokeRect(25, 55, 1310, 585);

  // 상단 좌우 깜빡이 LED (Amber Blinkers)
  if (hazardLights && blinkPhase) {
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.arc(45, 75, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(45, 75, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.arc(1315, 75, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(1315, 75, 6, 0, Math.PI*2); ctx.fill();
  } else if (turnSignalRight && blinkPhase) {
    ctx.fillStyle = "#22c55e";
    ctx.beginPath(); ctx.arc(1315, 75, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#bbf7d0"; ctx.beginPath(); ctx.arc(1315, 75, 6, 0, Math.PI*2); ctx.fill();
  }

  // 상단 관찰 렌즈
  ctx.beginPath(); ctx.arc(680, 52, 24, 0, Math.PI * 2);
  ctx.fillStyle = "#1e293b"; ctx.fill();
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(680, 52, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#38bdf8"; ctx.fill();

  const wSide = 260, hSide = 555, sideY = 70;
  const xLeft = 40, xRight = 1060;
  const centerW = 730, centerX = 315;
  const frontY = 70, frontH = 135;
  const driverY = 215, driverH = 260;
  const rearY = 485, rearH = 140;

  let shiftRatio = Math.min(1.0, Math.max(0.0, (currentLaneF - 2.0) / 3.8));

  // -------------------------------------------------------------
  // CH-2: 왼쪽 카메라
  // -------------------------------------------------------------
  ctx.fillStyle = "#101626";
  ctx.fillRect(xLeft, sideY, wSide, hSide);
  ctx.strokeStyle = "#0ea5e9";
  ctx.lineWidth = 2;
  ctx.strokeRect(xLeft, sideY, wSide, hSide);

  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 2;
  let lx1 = 75 - shiftRatio * 35;
  let lx2 = 175 - shiftRatio * 45;
  for (let y = -80 + roadOffset; y < hSide + 80; y += 80) {
    ctx.beginPath(); ctx.moveTo(xLeft + lx1, sideY + y); ctx.lineTo(xLeft + lx1, sideY + y + 40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xLeft + lx2, sideY + y); ctx.lineTo(xLeft + lx2, sideY + y + 40); ctx.stroke();
  }
  for (let v of leftTraffic) {
    let vx = (v.lane === 0) ? xLeft + lx1 - 35 : xLeft + lx2 - 30;
    ctx.fillStyle = v.col;
    ctx.fillRect(vx, sideY + v.y, v.w, v.h);
    ctx.strokeStyle = "#94a3b8"; ctx.strokeRect(vx, sideY + v.y, v.w, v.h);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(vx + 4, sideY + v.y + v.h - 6, 6, 4);
    ctx.fillRect(vx + v.w - 10, sideY + v.y + v.h - 6, 6, 4);
    if (v.y > 150 && v.y < 350) {
      ctx.fillStyle = "rgba(220, 38, 38, 0.9)";
      ctx.fillRect(vx - 10, sideY + v.y - 18, 70, 16);
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif";
      ctx.fillText(`[${v.type}] 접근주의!`, vx - 6, sideY + v.y - 6);
    }
  }
  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 13px sans-serif";
  ctx.fillText("왼쪽 카메라", xLeft + 95, sideY + 25);

  // -------------------------------------------------------------
  // CH-3: 🌟 오른쪽 카메라 (5차선 최우측 갓길 1.2m 밀착 & 노란 빗금 안전지대)
  // -------------------------------------------------------------
  ctx.fillStyle = "#101626";
  ctx.fillRect(xRight, sideY, wSide, hSide);
  ctx.strokeStyle = "#0ea5e9";
  ctx.lineWidth = 2;
  ctx.strokeRect(xRight, sideY, wSide, hSide);

  if (currentLaneF > 4.0) {
    ctx.fillStyle = "#161b24";
    ctx.fillRect(xRight, sideY, wSide, hSide);

    // 노란색 대각선 빗금 안전지대
    ctx.strokeStyle = "rgba(234, 179, 8, 0.85)";
    ctx.lineWidth = 4;
    for (let sy = -80; sy < hSide + 80; sy += 32) {
      ctx.beginPath();
      ctx.moveTo(xRight + 8, sideY + sy);
      ctx.lineTo(xRight + 110, sideY + sy + 32);
      ctx.stroke();
    }

    // 갓길 경계 황색 실선
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(xRight + 115, sideY); ctx.lineTo(xRight + 115, sideY + hSide); ctx.stroke();

    // 1.2m 우측 밀착 스틸 가드레일
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(xRight + 155, sideY); ctx.lineTo(xRight + 155, sideY + hSide); ctx.stroke();

    // 가드레일 지주 및 주황색 반사판
    for (let gy = 15; gy < hSide; gy += 55) {
      ctx.fillStyle = "#475569"; ctx.fillRect(xRight + 150, sideY + gy, 20, 14);
      ctx.fillStyle = "#f97316"; ctx.beginPath(); ctx.arc(xRight + 156, sideY + gy + 7, 4.5, 0, Math.PI*2); ctx.fill();
    }

    // 가드레일 바깥쪽 수풀 녹지 비탈면
    ctx.fillStyle = "#0f2316";
    ctx.fillRect(xRight + 175, sideY, wSide - 175, hSide);

    // 갓길 안착 OSD 안내 배지
    ctx.fillStyle = "rgba(15, 23, 42, 0.94)";
    ctx.fillRect(xRight + 15, sideY + 225, wSide - 30, 85);
    ctx.strokeStyle = (blinkPhase) ? "#22c55e" : "#eab308";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(xRight + 15, sideY + 225, wSide - 30, 85);

    ctx.fillStyle = "#22c55e";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText("[최우측 갓길 정차 완료]", xRight + 36, sideY + 250);
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("우측 가드레일 1.2m 밀착", xRight + 42, sideY + 273);
    ctx.fillStyle = "#a7f3d0";
    ctx.font = "11px sans-serif";
    ctx.fillText("통행 차량 0대 (승객 안전 100%)", xRight + 26, sideY + 295);

  } else {
    for (let y = -80 + roadOffset; y < hSide + 80; y += 80) {
      ctx.strokeStyle = "#cbd5e1";
      ctx.beginPath(); ctx.moveTo(xRight + 75, sideY + y); ctx.lineTo(xRight + 75, sideY + y + 40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xRight + 165, sideY + y); ctx.lineTo(xRight + 165, sideY + y + 40); ctx.stroke();
    }
    for (let v of rightTraffic) {
      let vx = (v.lane === 0) ? xRight + 45 : xRight + 130;
      ctx.fillStyle = v.col; ctx.fillRect(vx, sideY + v.y, v.w, v.h);
      ctx.strokeStyle = "#94a3b8"; ctx.strokeRect(vx, sideY + v.y, v.w, v.h);
    }
  }

  // 우측 깜빡이 작동 중 배지 표시
  if (turnSignalRight && blinkPhase) {
    ctx.fillStyle = "rgba(34, 197, 94, 0.95)";
    ctx.fillRect(xRight + 20, sideY + 50, wSide - 40, 30);
    ctx.strokeStyle = "#fff"; ctx.strokeRect(xRight + 20, sideY + 50, wSide - 40, 30);
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif";
    ctx.fillText("▶▶ 우측 깜빡이 ON ▶▶", xRight + 32, sideY + 70);
  }

  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 13px sans-serif";
  ctx.fillText("오른쪽 카메라", xRight + 90, sideY + 25);

  // -------------------------------------------------------------
  // CH-4: 전방 카메라
  // -------------------------------------------------------------
  ctx.fillStyle = "#111a2e";
  ctx.fillRect(centerX, frontY, centerW, frontH);
  ctx.strokeStyle = "#0ea5e9"; ctx.lineWidth = 2;
  ctx.strokeRect(centerX, frontY, centerW, frontH);

  let fxCenter = centerX + centerW / 2 - (shiftRatio - 0.25) * 110;
  ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fxCenter - 40, frontY + 40); ctx.lineTo(fxCenter - 200, frontY + frontH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fxCenter + 40, frontY + 40); ctx.lineTo(fxCenter + 200, frontY + frontH); ctx.stroke();

  if (currentLaneF > 4.0) {
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(fxCenter + 120, frontY + 50); ctx.lineTo(fxCenter + 280, frontY + frontH); ctx.stroke();
  }

  if (speed > 0) {
    ctx.fillStyle = "#334155";
    let fcY = frontY + 60;
    ctx.fillRect(fxCenter - 25, fcY, 50, 42);
    ctx.strokeStyle = "#38bdf8"; ctx.strokeRect(fxCenter - 25, fcY, 50, 42);
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(fxCenter - 16, fcY + 34, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(fxCenter + 16, fcY + 34, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#94a3b8"; ctx.font = "11px sans-serif";
    ctx.fillText(`[앞차] 45고 1234 (${frontLeadDist.toFixed(1)}m)`, fxCenter - 45, fcY - 8);
  }
  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
  ctx.fillText("전방카메라", centerX + centerW/2 - 30, frontY + 22);

  // -------------------------------------------------------------
  // CH-1: DSM 운전자 카메라 (실시간 웹캠 영상 or 리얼 AI 운전자)
  // -------------------------------------------------------------
  ctx.fillStyle = "#090d16";
  ctx.fillRect(centerX, driverY, centerW, driverH);
  ctx.strokeStyle = (isAbnormal) ? "#ef4444" : "#22c55e";
  ctx.lineWidth = 2;
  ctx.strokeRect(centerX, driverY, centerW, driverH);

  let realVideoActive = hasWebcam && video.readyState >= 2 && video.videoWidth > 0;

  if (realVideoActive) {
    ctx.save();
    ctx.translate(centerX + centerW, driverY);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, centerW, driverH);
    ctx.restore();

    // 🌟 [핵심] 실제 비디오 위에 실시간 눈동자(동공) 십자선 & 조준경 오버레이!
    if (pupilLocked && isFaceDetected) {
      // 좌안 동공 십자선 (청록색)
      let lx = centerX + leftPupilX;
      let ly = driverY + leftPupilY;
      ctx.strokeStyle = "#06b6d4"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(lx, ly, 12, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI*2); ctx.fillStyle = "#22c55e"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(lx - 18, ly); ctx.lineTo(lx + 18, ly); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx, ly - 18); ctx.lineTo(lx, ly + 18); ctx.stroke();
      ctx.fillStyle = "#22c55e"; ctx.font = "bold 10px sans-serif";
      ctx.fillText("[좌안 동공 추적 중]", lx - 38, ly - 22);

      // 우안 동공 십자선 (청록색)
      let rx = centerX + rightPupilX;
      let ry = driverY + rightPupilY;
      ctx.strokeStyle = "#06b6d4"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 12, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(rx, ry, 4, 0, Math.PI*2); ctx.fillStyle = "#22c55e"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(rx - 18, ry); ctx.lineTo(rx + 18, ry); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(rx, ry - 18); ctx.lineTo(rx, ry + 18); ctx.stroke();
      ctx.fillStyle = "#22c55e"; ctx.font = "bold 10px sans-serif";
      ctx.fillText("[우안 동공 추적 중]", rx - 38, ry - 22);
    }

  } else {
    // 가상 AI 운전자 그래픽
    let headX = centerX + centerW / 2;
    let headY = driverY + driverH / 2 + 10;

    if (isFaceDetected) {
      // 운전자 어깨 및 정장
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.moveTo(headX - 110, driverY + driverH);
      ctx.quadraticCurveTo(headX - 90, headY + 50, headX - 45, headY + 50);
      ctx.lineTo(headX + 45, headY + 50);
      ctx.quadraticCurveTo(headX + 90, headY + 50, headX + 110, driverY + driverH);
      ctx.closePath();
      ctx.fill();

      // 셔츠 칼라 및 넥타이
      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.moveTo(headX - 25, headY + 50); ctx.lineTo(headX, headY + 75); ctx.lineTo(headX + 25, headY + 50);
      ctx.fill();

      ctx.fillStyle = "#0284c7";
      ctx.beginPath();
      ctx.moveTo(headX - 8, headY + 70); ctx.lineTo(headX + 8, headY + 70); ctx.lineTo(headX + 12, headY + 120);
      ctx.lineTo(headX, headY + 130); ctx.lineTo(headX - 12, headY + 120);
      ctx.closePath();
      ctx.fill();

      // 얼굴 윤곽
      ctx.fillStyle = "#2d3748"; ctx.beginPath(); ctx.arc(headX, headY - 15, 68, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fad390"; ctx.beginPath(); ctx.ellipse(headX, headY - 2, 52, 60, 0, 0, Math.PI*2); ctx.fill();

      // 헤어
      ctx.fillStyle = "#1a202c";
      ctx.beginPath();
      ctx.moveTo(headX - 52, headY - 20); ctx.quadraticCurveTo(headX - 20, headY - 55, headX + 30, headY - 50);
      ctx.quadraticCurveTo(headX + 52, headY - 40, headX + 52, headY - 15);
      ctx.quadraticCurveTo(headX + 20, headY - 35, headX - 52, headY - 20);
      ctx.fill();

      // 눈 및 동공
      if (leftOpen) {
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(headX - 22, headY - 8, 12, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(headX - 22, headY - 8, 4.5, 0, Math.PI*2); ctx.fill();
        // 동공 십자선
        ctx.strokeStyle = "#06b6d4"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(headX - 22, headY - 8, 9, 0, Math.PI*2); ctx.stroke();
      } else {
        ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(headX - 32, headY - 6); ctx.lineTo(headX - 12, headY - 6); ctx.stroke();
      }

      if (rightOpen) {
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(headX + 22, headY - 8, 12, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(headX + 22, headY - 8, 4.5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#06b6d4"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(headX + 22, headY - 8, 9, 0, Math.PI*2); ctx.stroke();
      } else {
        ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(headX + 12, headY - 6); ctx.lineTo(headX + 32, headY - 6); ctx.stroke();
      }

      // 안전벨트
      ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(headX - 85, driverY + driverH); ctx.lineTo(headX + 45, headY + 50); ctx.stroke();
    } else {
      // 운전자 자리비움 (빈 운전석)
      ctx.fillStyle = "rgba(220, 38, 38, 0.2)";
      ctx.fillRect(centerX + 150, driverY + 30, centerW - 300, driverH - 60);
      ctx.fillStyle = "#ef4444"; ctx.font = "bold 18px sans-serif";
      ctx.fillText("⚠️ 운전자 자리비움 (좌석 이탈 감지)", centerX + centerW/2 - 135, driverY + driverH/2);
    }
  }

  // -------------------------------------------------------------
  // 🌟 안면/동공 랜드마크 & 상태 OSD
  // -------------------------------------------------------------
  let boxColor = (isAbnormal) ? "#ef4444" : "#22c55e";
  
  if (isFaceDetected) {
    ctx.strokeStyle = boxColor; ctx.lineWidth = 2.5;
    ctx.strokeRect(centerX + 180, driverY + 25, 370, 195);

    let eyeBoxLeftX = centerX + 245;
    let eyeBoxRightX = centerX + 410;
    let eyeBoxY = driverY + 70;

    // 좌안 박스
    ctx.strokeStyle = (leftOpen) ? "#06b6d4" : "#ef4444";
    ctx.lineWidth = 2;
    ctx.strokeRect(eyeBoxLeftX, eyeBoxY, 80, 50);
    if (!leftOpen) {
      ctx.fillStyle = "rgba(239, 68, 68, 0.85)"; ctx.fillRect(eyeBoxLeftX, eyeBoxY + 18, 80, 14);
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.fillText("좌안: 감김", eyeBoxLeftX + 18, eyeBoxY + 30);
    }

    // 우안 박스
    ctx.strokeStyle = (rightOpen) ? "#06b6d4" : "#ef4444";
    ctx.lineWidth = 2;
    ctx.strokeRect(eyeBoxRightX, eyeBoxY, 80, 50);
    if (!rightOpen) {
      ctx.fillStyle = "rgba(239, 68, 68, 0.85)"; ctx.fillRect(eyeBoxRightX, eyeBoxY + 18, 80, 14);
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.fillText("우안: 감김", eyeBoxRightX + 18, eyeBoxY + 30);
    }
  }

  // 동승 심사위원 감지 박스
  ctx.strokeStyle = "rgba(56, 189, 248, 0.45)"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.strokeRect(centerX + 30, driverY + 65, 120, 140);
  ctx.fillStyle = "rgba(56, 189, 248, 0.85)"; ctx.font = "10px sans-serif";
  ctx.fillText("[심사위원 1 감지]", centerX + 40, driverY + 80);
  ctx.strokeRect(centerX + 580, driverY + 65, 120, 140);
  ctx.fillText("[심사위원 2 감지]", centerX + 590, driverY + 80);
  ctx.setLineDash([]);

  // CH-1 라벨
  ctx.fillStyle = "#22c55e"; ctx.font = "bold 12px sans-serif";
  ctx.fillText("CH-1 운전자 안면/동공 실시간 추적 (AI DSM 다중 인원 모니터링)", centerX + 15, driverY + 22);

  // 실시간 동공 개도율 게이지
  ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
  ctx.fillRect(centerX + 15, driverY + 35, 145, 52);
  ctx.strokeStyle = boxColor; ctx.strokeRect(centerX + 15, driverY + 35, 145, 52);
  ctx.fillStyle = "#cbd5e1"; ctx.font = "10px sans-serif";
  ctx.fillText("동공 개도율 (EAR)", centerX + 22, driverY + 50);
  ctx.fillStyle = (isAbnormal) ? "#ef4444" : "#22c55e";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(`${eyeOpenRatio}% (${isAbnormal ? "감김/기절" : "동공 락온"})`, centerX + 22, driverY + 68);

  ctx.fillStyle = "#334155"; ctx.fillRect(centerX + 22, driverY + 74, 130, 6);
  ctx.fillStyle = (isAbnormal) ? "#ef4444" : "#22c55e";
  ctx.fillRect(centerX + 22, driverY + 74, (130 * eyeOpenRatio) / 100, 6);

  // 대표이사 ID 배지
  ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
  ctx.fillRect(centerX + centerW - 270, driverY + 8, 255, 24);
  ctx.strokeStyle = "#eab308"; ctx.strokeRect(centerX + centerW - 270, driverY + 8, 255, 24);
  ctx.fillStyle = "#fef08a"; ctx.font = "bold 11px sans-serif";
  ctx.fillText("인증: 변귀섭 대표이사 (생체감시 ON)", centerX + centerW - 260, driverY + 24);

  // DSM 하단 상태 바
  let statusBg = (isAbnormal || state.startsWith("EVADE")) ? "rgba(185, 28, 28, 0.95)" : "rgba(22, 101, 52, 0.95)";
  ctx.fillStyle = statusBg;
  ctx.fillRect(centerX + 25, driverY + driverH - 34, centerW - 50, 26);
  ctx.strokeStyle = "#fff"; ctx.strokeRect(centerX + 25, driverY + driverH - 34, centerW - 50, 26);
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
  
  let statusText = (state.startsWith("EVADE")) 
    ? `🚨 ${rightMergeStatus}`
    : (state === "COUNTDOWN_5SEC")
      ? `🚨 [비상정차 5초 카운트다운] ${countdownReason} (${countdown.toFixed(1)}초 후 갓길 자율정차 | 하단 [E]로 복귀)`
      : (isAbnormal
        ? `⚠️ [기절 감지] ${countdownReason} 감지 중... (지속 시 비상정차 돌입 | 심박수 ${heartRate}bpm 급감)`
        : `[정상] 동공개도율 ${eyeOpenRatio}% -> 눈동자 추적 중 (💡 카메라에서 눈감거나 하단 [E] 클릭 시 기절 감지)`);
  ctx.fillText(statusText, centerX + 35, driverY + driverH - 17);

  // -------------------------------------------------------------
  // CH-5: 후방 카메라 & 갓길 정차 시 안전 삼각콘
  // -------------------------------------------------------------
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(centerX, rearY, centerW, rearH);
  ctx.strokeStyle = "#0ea5e9"; ctx.lineWidth = 2;
  ctx.strokeRect(centerX, rearY, centerW, rearH);

  let rxCenter = centerX + centerW / 2 + (shiftRatio - 0.25) * 70;
  ctx.strokeStyle = "#cbd5e1";
  ctx.beginPath(); ctx.moveTo(rxCenter - 30, rearY + 30); ctx.lineTo(rxCenter - 160, rearY + rearH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rxCenter + 30, rearY + 30); ctx.lineTo(rxCenter + 160, rearY + rearH); ctx.stroke();
  ctx.strokeStyle = "#22c55e"; ctx.beginPath(); ctx.moveTo(rxCenter - 90, rearY + 70); ctx.lineTo(rxCenter + 90, rearY + 70); ctx.stroke();
  ctx.strokeStyle = "#facc15"; ctx.beginPath(); ctx.moveTo(rxCenter - 70, rearY + 95); ctx.lineTo(rxCenter + 70, rearY + 95); ctx.stroke();
  ctx.strokeStyle = "#ef4444"; ctx.beginPath(); ctx.moveTo(rxCenter - 50, rearY + 118); ctx.lineTo(rxCenter + 50, rearY + 118); ctx.stroke();

  if (state === "STOPPED" && currentLaneF > 4.2) {
    ctx.fillStyle = "#ea580c";
    ctx.beginPath();
    ctx.moveTo(rxCenter, rearY + 80); ctx.lineTo(rxCenter - 20, rearY + 125); ctx.lineTo(rxCenter + 20, rearY + 125);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(rxCenter - 12, rearY + 105); ctx.lineTo(rxCenter + 12, rearY + 105); ctx.stroke();
    
    if (blinkPhase) {
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.arc(rxCenter, rearY + 76, 6, 0, Math.PI*2); ctx.fill();
    }

    ctx.fillStyle = "rgba(194, 65, 12, 0.95)";
    ctx.fillRect(centerX + centerW - 230, rearY + 40, 210, 26);
    ctx.strokeStyle = "#facc15"; ctx.strokeRect(centerX + centerW - 230, rearY + 40, 210, 26);
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif";
    ctx.fillText("[안전 삼각콘 자동 설치 완료]", centerX + centerW - 218, rearY + 58);

  } else {
    let rearCarX = rxCenter - rearLeadOffsetX;
    let rearCarY = rearY + 45 + (22.0 - rearLeadDist) * 2.2;
    let rcScale = Math.max(0.7, Math.min(1.6, 1.0 + (22.0 - rearLeadDist) / 16.0));
    let rcW = 55 * rcScale;
    let rcH = 40 * rcScale;

    ctx.fillStyle = "#1e293b"; ctx.fillRect(rearCarX - rcW/2, rearCarY, rcW, rcH);
    ctx.strokeStyle = "#38bdf8"; ctx.strokeRect(rearCarX - rcW/2, rearCarY, rcW, rcH);
    ctx.fillStyle = "#fef08a";
    ctx.beginPath(); ctx.arc(rearCarX - rcW/2 + 10, rearCarY + rcH - 12, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rearCarX + rcW/2 - 10, rearCarY + rcH - 12, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0f172a"; ctx.fillRect(rearCarX - 16, rearCarY + rcH - 16, 32, 8);
    ctx.fillStyle = "#cbd5e1"; ctx.fillRect(rearCarX - 10, rearCarY + rcH - 10, 20, 6);

    let rTag = (currentLaneF <= 3.8 && speed <= 0.0) 
      ? `[뒤차] ${rearLeadDist.toFixed(1)}m (3차선 비상정차 완료 | 2차 추돌 0건)`
      : (currentLaneF <= 3.8 && state === "SUA"
        ? `[뒤차] ${rearLeadDist.toFixed(1)}m (비상 감속 정차 유도 중)`
        : (rearLeadOffsetX > 20
          ? `[뒤차] ${rearLeadDist.toFixed(1)}m (좌측 회피 추월 중)`
          : `[뒤차] ${rearLeadDist.toFixed(1)}m (추종 주행 중)`));
    let rTagColor = (speed <= 0.0) ? "#22c55e" : "#38bdf8";
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(centerX + 20, rearY + 36, 300, 22);
    ctx.strokeStyle = rTagColor; ctx.strokeRect(centerX + 20, rearY + 36, 300, 22);
    ctx.fillStyle = rTagColor; ctx.font = "bold 11px sans-serif";
    ctx.fillText(rTag, centerX + 28, rearY + 51);
  }
  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
  ctx.fillText("후방카메라", centerX + centerW/2 - 30, rearY + 20);

  // -------------------------------------------------------------
  // 🌟 상단 헤더 OSD (절대 겹침 없는 1:1 정밀 배치)
  // -------------------------------------------------------------
  // 1) 좌상단 타이틀 (x: 35 ~ 250)
  ctx.fillStyle = "#38bdf8"; ctx.font = "bold 13px sans-serif";
  ctx.fillText("SafetyON™ 전자식 룸미러", 35, 24);
  ctx.fillStyle = "#a3e635"; ctx.font = "10px sans-serif";
  ctx.fillText("[특허 10건 공표 | 우선심사 결정]", 35, 42);

  // 2) 발표 타이머 박스 (x: 270 ~ 380) - 여유공간 100% 확보!
  let timerMin = String(Math.floor(timerSec / 60)).padStart(2, '0');
  let timerS = String(timerSec % 60).padStart(2, '0');
  let timerColor = (timerSec >= 300) ? "#ef4444" : (timerSec >= 240 ? "#f59e0b" : "#4ade80");
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.fillRect(270, 10, 110, 32);
  ctx.strokeStyle = timerColor; ctx.strokeRect(270, 10, 110, 32);
  ctx.fillStyle = timerColor; ctx.font = "bold 12px sans-serif";
  ctx.fillText(`${timerMin}:${timerS} / 05:00`, 282, 31);

  // 3) 비상등 / 깜빡이 / 주행차선 (x: 395 ~ 540)
  if (hazardLights && blinkPhase) {
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(395, 12, 145, 28);
    ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 2;
    ctx.strokeRect(395, 12, 145, 28);
    ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
    ctx.fillText("◀◀ 비상등 점멸 ▶▶", 408, 31);
  } else if (turnSignalRight && blinkPhase) {
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(395, 12, 145, 28);
    ctx.strokeStyle = "#bbf7d0"; ctx.lineWidth = 2;
    ctx.strokeRect(395, 12, 145, 28);
    ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
    ctx.fillText("▶▶ 우측 깜빡이 ON ▶▶", 403, 31);
  } else {
    let laneBadge = (currentLaneF > 4.5) ? "위치:[5차선 갓길]" : `주행:[${currentLaneF.toFixed(1)}차선]`;
    ctx.fillStyle = (currentLaneF > 4.5) ? "#facc15" : "#38bdf8";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(laneBadge, 430, 31);
  }

  // 4) 속도 (x: 555)
  ctx.fillStyle = (speed > 0) ? "#4ade80" : "#ef4444";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText(`속도:${speed.toFixed(1)}km/h`, 555, 31);

  // 5) 감속도 (x: 675)
  ctx.fillStyle = (gForce < 0) ? "#f59e0b" : "#94a3b8";
  ctx.fillText(`감속도:${gForce.toFixed(2)}G`, 675, 31);

  // 6) 조향각 (x: 775)
  ctx.fillStyle = "#38bdf8";
  ctx.fillText(`조향:${steerAngle.toFixed(1)}°`, 775, 31);

  // 7) 🌟 심박수 (x: 870) - 대표님 요청: 기절 시 40bpm으로 급감 및 붉은색 경고!
  let hrColor = (heartRate <= 50) ? "#ef4444" : "#38bdf8";
  ctx.fillStyle = hrColor;
  ctx.font = "bold 13px sans-serif";
  let hrText = (heartRate <= 50) ? `심박:${heartRate}bpm(서맥위험)` : `심박:${heartRate}bpm`;
  ctx.fillText(hrText, 870, 31);

  // 8) 🌟 심전도(ECG) 파형 (x: 1030 ~ 1170) - 40bpm 서맥 시 파형 2.5배 느려짐!
  ctx.strokeStyle = (heartRate <= 50) ? "#ef4444" : "#22c55e";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  let ecgBaseX = 1030, ecgBaseY = 28;
  let waveFreq = (heartRate <= 50) ? 2.5 : 6.0;
  for (let i = 0; i < 90; i++) {
    let wave = Math.sin((simTime * waveFreq) + (i * 0.15));
    if (i > 35 && i < 45) wave = -Math.sin((i - 35) * 0.6) * 12;
    ctx.lineTo(ecgBaseX + i, ecgBaseY + wave);
  }
  ctx.stroke();

  if (isMuted) {
    ctx.fillStyle = "#ef4444"; ctx.font = "bold 11px sans-serif";
    ctx.fillText("[MUTE]", 1180, 31);
  }

  // -------------------------------------------------------------
  // e-Call 구난 패널 (갓길 정차 완료 시)
  // -------------------------------------------------------------
  if (state === "STOPPED") {
    ctx.fillStyle = "rgba(11, 17, 32, 0.96)";
    ctx.fillRect(centerX + 30, driverY + 15, centerW - 60, driverH + rearH - 30);
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.strokeRect(centerX + 30, driverY + 15, centerW - 60, driverH + rearH - 30);
